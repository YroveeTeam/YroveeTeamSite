<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YroveeLauncher — лаунчер для Minecraft</title>
<meta name="description" content="Свой лаунчер для Minecraft: Fabric, Forge, Quilt, NeoForge, моды, шейдеры, сборки, серверы.">
<link rel="icon" href="assets/favicon.png">
<!-- превью ссылки в Discord/Telegram/ВК -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="YroveeLauncher">
<meta property="og:title" content="YroveeLauncher — лаунчер для Minecraft">
<meta property="og:description" content="Моды, шейдеры, сборки, серверы и красивый интерфейс. Fabric, Forge, Quilt, NeoForge.">
<meta property="og:image" content="assets/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0d13">
<style>
  :root{
    --bg:#0b0d13; --card:#131722; --field:#0c0f16; --border:#222839; --text:#eef1f7; --muted:#8a93a6;
    --a:#4ade80; --b:#22d3ee; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  nav{position:sticky;top:0;z-index:5;background:rgba(11,13,19,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  nav .wrap{display:flex;align-items:center;gap:22px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;text-decoration:none;margin-right:auto}
  .brand img{width:34px;height:34px;border-radius:9px}
  nav a.l{color:var(--muted);text-decoration:none;font-size:15px}
  nav a.l:hover{color:var(--text)}
  .btn{display:inline-block;padding:13px 26px;border-radius:14px;font-weight:700;text-decoration:none;color:#06121a;
       background:linear-gradient(90deg,var(--a),var(--b));transition:transform .15s,filter .15s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:#1b2233}
  .hero{padding:56px 0 30px;text-align:center}
  .hero img.banner{width:100%;max-width:880px;border-radius:24px;border:1px solid var(--border);box-shadow:0 30px 80px rgba(34,211,238,.10)}
  h1{font-size:clamp(34px,6vw,58px);line-height:1.1;margin:30px 0 12px}
  h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--muted);max-width:640px;margin:0 auto 26px;font-size:18px}
  .hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .req{margin-top:14px;font-size:13px;color:var(--muted)}
  section{padding:46px 0}
  h2{font-size:30px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px 22px}
  .card h3{margin:0 0 6px;font-size:17px}
  .card p{margin:0;color:var(--muted);font-size:14.5px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden}
  th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:0}
  th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;background:#16202c}
  .tag.ok{color:var(--a)} .tag.beta{color:var(--warn)} .tag.plan{color:var(--muted)}
  .rel{margin-bottom:14px}
  .rel .top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .rel .ver{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .rel .date{color:var(--muted);font-size:13px}
  .rel .new{font-size:12px;font-weight:800;color:#06121a;background:var(--a);padding:2px 10px;border-radius:99px}
  .rel ul{margin:0;padding-left:20px;color:#c7cfdf}
  .rel li{margin:3px 0}
  details{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 20px;margin-bottom:10px}
  summary{cursor:pointer;font-weight:600}
  details p{color:var(--muted);margin:10px 0 0}
  footer{border-top:1px solid var(--border);padding:28px 0;color:var(--muted);font-size:14px;text-align:center}
  footer a{color:var(--text)}
  @media (max-width:640px){nav a.l{display:none}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="#top"><img src="assets/logo.png" alt=""><span id="navName"></span></a>
  <a class="l" href="#features">Возможности</a><a class="l" href="#versions">Версии</a>
  <a class="l" href="#changelog">Изменения</a><a class="l" href="#faq">FAQ</a>
  <a class="btn" id="navDl" href="#">Скачать</a>
</div></nav>

<header class="hero" id="top"><div class="wrap">
  <img class="banner" src="assets/banner.png" alt="YroveeLauncher">
  <h1><span id="heroName"></span></h1>
  <p id="tagline"></p>
  <div class="row"><a class="btn" id="heroDl" href="#">Скачать <span id="heroVer"></span></a>
  <a class="btn ghost" id="src" href="#">Исходный код</a></div>
  <div class="req" id="req"></div>
</div></header>

<section id="features"><div class="wrap">
  <h2>Возможности</h2><p class="sub">Всё, что нужно для игры, в одном окне</p>
  <div class="grid" id="featGrid"></div>
</div></section>

<section id="versions"><div class="wrap">
  <h2>Поддерживаемые версии</h2><p class="sub">Что умеет запускать лаунчер сейчас</p>
  <table><thead><tr><th>Загрузчик</th><th>Версии Minecraft</th><th>Статус</th></tr></thead><tbody id="supBody"></tbody></table>
</div></section>

<section id="changelog"><div class="wrap">
  <h2>Что нового</h2><p class="sub">История изменений</p>
  <div id="logList"></div>
</div></section>

<section id="faq"><div class="wrap">
  <h2>Вопросы и ответы</h2><p class="sub">&nbsp;</p>
  <div id="faqList"></div>
</div></section>

<footer><div class="wrap"><span id="foot"></span></div></footer>

<script src="data.js"></script>
<script>
  const S = window.SITE, $ = id => document.getElementById(id);
  document.title = S.name + " — лаунчер для Minecraft";
  $("navName").textContent = S.name; $("heroName").textContent = S.name; $("tagline").textContent = S.tagline;
  $("heroVer").textContent = "v" + S.version; $("req").textContent = S.requirements;
  ["navDl","heroDl"].forEach(i => $(i).href = S.downloadUrl); $("src").href = S.sourceUrl;

  // Кнопка «Скачать» сама ведёт на последний релиз с GitHub Releases.
  // Работает, когда в data.js указана ссылка на репозиторий (даже с ТВОЙ_НИК — нет релиза, останется запасная ссылка).
  (async () => {
    try {
      const m = (S.sourceUrl || S.downloadUrl || "").match(/github\.com\/([^/]+)\/([^/&#]+)/);
      if (!m) return;
      const r = await fetch(`https://api.github.com/repos/${m[1]}/${m[2]}/releases/latest`,
                            {headers: {"Accept": "application/vnd.github+json"}});
      if (!r.ok) return;
      const rel = await r.json();
      const assets = rel.assets || [];
      // Setup.exe (установщик) или zip (портативная). Голый YroveeLauncher.exe из
      // папки сборки не подходит — он не работает без соседней папки _internal.
      const asset = assets.find(a => /setup/i.test(a.name) && a.name.endsWith(".exe"))
                 || assets.find(a => a.name.endsWith(".zip"));
      if (asset) ["navDl", "heroDl"].forEach(i => $(i).href = asset.browser_download_url);
      const v = (rel.tag_name || "").replace(/^v/, "");
      const nums = s => s.split(".").map(Number);
      const newer = (a, b) => { const x = nums(a), y = nums(b);
        return x[0] !== y[0] ? x[0] > y[0] : (x[1] || 0) > (y[1] || 0); };
      if (v && newer(v, S.version)) $("heroVer").textContent = "v" + v;
    } catch (e) { /* нет сети/лимит GitHub — ссылка из data.js остаётся */ }
  })();

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  S.features.forEach(([t, d]) => { const c = el("div", "card"); c.append(el("h3", null, t), el("p", null, d)); $("featGrid").append(c); });

  S.supported.forEach(([l, v, st]) => {
    const tr = el("tr"), td3 = el("td"), cls = st === "работает" ? "ok" : st === "бета" ? "beta" : "plan";
    td3.append(el("span", "tag " + cls, st));
    tr.append(el("td", null, l), el("td", null, v), td3); $("supBody").append(tr);
  });

  S.changelog.forEach((r, i) => {
    const box = el("div", "card rel"), top = el("div", "top");
    top.append(el("span", "ver", "v" + r.v), el("span", "date", r.date));
    if (i === 0) top.append(el("span", "new", "NEW"));
    const ul = el("ul"); r.items.forEach(t => ul.append(el("li", null, t)));
    box.append(top, ul); $("logList").append(box);
  });

  S.faq.forEach(([q, a]) => { const d = el("details"); d.append(el("summary", null, q), el("p", null, a)); $("faqList").append(d); });
  $("foot").textContent = "© " + new Date().getFullYear() + " " + S.name + " · не связан с Mojang и Microsoft";
</script>
</body>
</html>
